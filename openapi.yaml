openapi: 3.0.3
info:
  title: Oh Your Ear API
  description: API for the Oh Your Ear ear training application
  version: 1.0.0

servers:
  - url: /api/v1
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/code:
    post:
      operationId: requestEmailCode
      summary: Send an email verification code
      description: |
        Always answers 204 for a valid address so the endpoint cannot be used to
        enumerate accounts. Only one code per address is kept alive at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '204':
          description: Code sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/register:
    post:
      operationId: register
      summary: Register or login with email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAuthRequest'
      responses:
        '200':
          description: Authenticated user with tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/login:
    post:
      operationId: login
      summary: Login with email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAuthRequest'
      responses:
        '200':
          description: Authenticated user with tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getMe
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: logout
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/plan:
    get:
      operationId: getStudyPlan
      summary: Get the study plan and today's progress for the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Study plan with today's progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateStudyPlan
      summary: Create or replace the study plan for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyPlanUpdate'
      responses:
        '200':
          description: Saved study plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/practice-records:
    post:
      operationId: createPracticeRecord
      summary: Record the result of one answered question
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeRecordRequest'
      responses:
        '201':
          description: Record stored
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    EmailAuthRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: '123456'
        name:
          type: string
          nullable: true
          maxLength: 100
          example: Alice

    AuthResponse:
      type: object
      required:
        - user
        - accessToken
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        accessToken:
          type: string
        refreshToken:
          type: string

    EmailCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ExerciseKind:
      type: string
      description: The five exercise modules. Melody and rhythm are scored as a whole.
      enum:
        - singleNote
        - interval
        - chord
        - melody
        - rhythm

    DailyProgress:
      type: object
      required:
        - date
        - solved
        - correct
      properties:
        date:
          type: string
          format: date
          description: Calendar date in the server's APP_TIMEZONE.
        solved:
          type: integer
        correct:
          type: integer
        byExercise:
          type: object
          description: Solved count per exercise kind, only for kinds practised today.
          additionalProperties:
            type: integer

    StudyPlan:
      type: object
      required:
        - dailyGoal
        - focusExercises
        - today
      properties:
        dailyGoal:
          type: integer
          minimum: 1
          maximum: 500
        focusExercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseKind'
        today:
          $ref: '#/components/schemas/DailyProgress'

    StudyPlanUpdate:
      type: object
      required:
        - dailyGoal
      properties:
        dailyGoal:
          type: integer
          minimum: 1
          maximum: 500
        focusExercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseKind'

    PracticeRecordRequest:
      type: object
      required:
        - exercise
        - correct
      properties:
        exercise:
          $ref: '#/components/schemas/ExerciseKind'
        correct:
          type: boolean
        chosen:
          type: string
          nullable: true
        expected:
          type: string
          nullable: true

    UserResponse:
      type: object
      required:
        - id
        - email
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
