name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '10.15.0'
  GO_VERSION: '1.26.4'
  GOLANGCI_LINT_VERSION: 'v2.13.2'

jobs:
  lockfile:
    name: Check pnpm lockfile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  openapi-drift:
    name: Check OpenAPI generated code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate frontend types
        run: pnpm --filter @oh-your-ear/web run generate

      - name: Generate backend server/types
        run: pnpm --filter @oh-your-ear/api run generate

      - name: Check for drift
        run: git diff --exit-code

  file-size-check:
    name: Source file size check
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Check source file lengths
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          declare -A limits=(
            [go]=300
            [py]=300
            [ts]=250
            [tsx]=250
            [js]=250
            [jsx]=250
            [rs]=300
            [java]=300
            [c]=300
            [cpp]=300
            [h]=300
            [cs]=300
            [rb]=300
            [php]=300
            [swift]=300
            [kt]=300
            [scala]=300
          )

          over_limit=0
          while IFS= read -r file; do
            ext="${file##*.}"
            ext_lower="${ext,,}"
            limit="${limits[$ext_lower]:-}"
            [[ -z "$limit" ]] && continue

            case "$file" in
              */generated.*|*.generated.*|*.gen.*|*.d.ts) continue ;;
            esac

            lines=$(wc -l < "$file")
            if (( lines > limit )); then
              over_limit=1
              echo "::warning file=$file,line=$limit::$file has $lines lines (limit $limit)"
            fi
          done < <(git ls-files)

          if (( over_limit == 0 )); then
            echo "All source files are within line limits."
          fi

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check i18n keys
        run: pnpm run check:i18n

      - name: Check formatting
        run: pnpm run format:check

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  api:
    name: API checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/api
          args: --timeout=5m

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/server ./cmd/server
