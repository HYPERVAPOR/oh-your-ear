name: oh-your-ear

services:
  # Installs the workspace once, then exits. The two front ends mount the same
  # node_modules, so letting each of them run `pnpm install` on start meant three
  # concurrent installs into one directory on a cold start (pnpm takes no directory
  # lock), and the same work paid three times on every `up`.
  install:
    image: node:24.16.0-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command:
      - sh
      - -c
      - |
        corepack enable
        corepack prepare pnpm@10.15.0 --activate
        pnpm install --config.confirmModulesPurge=false

  web:
    image: node:24.16.0-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: "http://api:8080"
      # The nameplate in the app header points at the marketing site; in dev that is
      # the landing dev server, not the real domain.
      VITE_LANDING_URL: "http://localhost:5174"
    command:
      - sh
      - -c
      - |
        corepack enable
        corepack prepare pnpm@10.15.0 --activate
        pnpm --filter @oh-your-ear/web dev
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_started

  landing:
    image: node:24.16.0-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    ports:
      - "5174:5174"
    command:
      - sh
      - -c
      - |
        corepack enable
        corepack prepare pnpm@10.15.0 --activate
        pnpm --filter @oh-your-ear/landing dev
    depends_on:
      install:
        condition: service_completed_successfully

  api:
    image: golang:1.26.4-bookworm
    working_dir: /workspace/apps/api
    volumes:
      - ..:/workspace:cached
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/ohyourear?sslmode=disable"
      JWT_SECRET: "dev-secret"
      # Read from the environment so a developer can try Google sign-in locally
      # without writing a client secret into this tracked file: put them in the
      # repo-root .env and pass --env-file .env, exactly as production does.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      MOCK_AUTH_EMAIL: "dev@ohyourear.test"
      MOCK_AUTH_NAME: "Developer"
      # MAIL_DRIVER=smtp + SMTP_HOST/SMTP_PORT to try real delivery locally,
      # e.g. against a throwaway relay on the host.
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@localhost}
    command:
      - sh
      - -c
      - |
        go mod download
        go run ./cmd/server
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ohyourear
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ohyourear"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
