name: oh-your-ear

services:
  web:
    image: node:24.16.0-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: "http://api:8080"
    command:
      - sh
      - -c
      - |
        corepack enable
        corepack prepare pnpm@10.15.0 --activate
        pnpm install --config.confirmModulesPurge=false
        pnpm --filter @oh-your-ear/web dev
    depends_on:
      - api

  api:
    image: golang:1.26.4-bookworm
    working_dir: /workspace/apps/api
    volumes:
      - ..:/workspace:cached
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/ohyourear?sslmode=disable"
      JWT_SECRET: "dev-secret"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URL: "http://localhost:8080/api/v1/auth/google/callback"
      MOCK_AUTH_EMAIL: "dev@ohyourear.test"
      MOCK_AUTH_NAME: "Developer"
    command:
      - sh
      - -c
      - |
        go mod download
        go run ./cmd/server
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ohyourear
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ohyourear"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
