services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ohyourear?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ohyourear
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres-data:
