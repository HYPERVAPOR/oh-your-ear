version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - gocritic
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - internal/api/generated.go
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/api/generated.go
