run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - gocritic
    - errname
    - copyloopvar

issues:
  exclude-files:
    - internal/api/generated.go

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
