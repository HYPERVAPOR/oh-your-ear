<!doctype html>
<meta charset="utf-8" />
<title>probe running</title>
<pre id="out">running</pre>
<iframe id="a" src="/" style="width: 1280px; height: 1100px; border: 0"></iframe>
<script>
  const log = []
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  ;(async () => {
    const d = () => document.getElementById('a').contentDocument
    try {
      for (let i = 0; i < 400 && !d().querySelector('main'); i++) await wait(50)
      await wait(1500)
      for (const h2 of d().querySelectorAll('main h2')) {
        log.push(`【${h2.textContent.trim()}】`)
        const section = h2.closest('section')
        for (const cell of section.querySelectorAll('a')) {
          const txt = [...cell.querySelectorAll('span')]
            .map((s) => s.textContent.trim())
            .filter(Boolean)
          log.push(`  ${txt.join('  ｜  ')}`)
        }
        const link = [...section.querySelectorAll('a')].find((a) =>
          a.className.includes('underline'),
        )
        if (link) log.push(`  [链接] ${link.textContent.trim()}`)
      }
      const today = d().querySelector('main > div > div')
      log.push('【今日】')
      for (const p of today.querySelectorAll('p, a, button')) {
        const t = p.textContent.trim()
        if (t) log.push(`  ${t}`)
      }
      const bar = today.querySelector('div[aria-hidden]')
      log.push(
        `  （进度条 ${Math.round(bar.getBoundingClientRect().width)}x${Math.round(bar.getBoundingClientRect().height)}）`,
      )
    } catch (e) {
      log.push('ERROR ' + e)
    }
    document.getElementById('out').textContent = log.join('\n')
    document.title = 'DONE'
  })()
</script>
