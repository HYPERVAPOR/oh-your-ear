<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-hosted face: preload it so the first paint is not the fallback font. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-latin.woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The pitch lives on the landing site: this host is the application itself, so it
         stays out of the index (see public/robots.txt too). -->
    <meta name="robots" content="noindex" />
    <title>Oh Your Ear</title>
    <script>
      // Apply the stored theme before first paint, otherwise dark-mode users get a
      // white flash while the React tree mounts. Keep in step with theme-provider.tsx.
      try {
        // The cookie first: on this site it is the preference the landing page wrote,
        // and it is the copy both sites share. Keep in step with
        // packages/shared/src/prefs.ts.
        const cookie = document.cookie.match(/(?:^|; )oye_prefs=([^;]*)/)
        const fromCookie = cookie ? cookie[1].split('|')[0] : null
        const stored = JSON.parse(localStorage.getItem('oye-app-storage') || '{}')
        const theme = fromCookie || (stored.state && stored.state.theme) || 'system'
        const dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch {
        // Unreadable storage: fall through to the light default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
