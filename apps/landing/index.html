<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-hosted face: preload it so the first paint is not the fallback font. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-latin.woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Oh Your Ear · 随时随地练耳</title>
    <meta
      name="description"
      content="在浏览器里练耳：单音、音程、和弦、旋律、节奏五组练习。游客打开即练，无需注册；登录后保存进度、错题本与连续打卡。中英双语，明暗主题。"
    />
    <link rel="canonical" href="https://ohyourear.com/" />

    <!-- The tab strip and the platform chrome follow the reader's colour scheme. -->
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100f" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oh Your Ear" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://ohyourear.com/" />
    <meta property="og:title" content="Oh Your Ear · 随时随地练耳" />
    <meta
      property="og:description"
      content="单音、音程、和弦、旋律、节奏五组练习。游客打开即练，无需注册。"
    />
    <!-- Absolute URL: social platforms do not resolve relative image paths. -->
    <meta property="og:image" content="https://ohyourear.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oh Your Ear · 随时随地练耳" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oh Your Ear · 随时随地练耳" />
    <meta
      name="twitter:description"
      content="单音、音程、和弦、旋律、节奏五组练习。游客打开即练，无需注册。"
    />
    <meta name="twitter:image" content="https://ohyourear.com/og.png" />

    <!-- Structured data: what this is, in the vocabulary a crawler already knows. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Oh Your Ear",
        "alternateName": "随时随地练耳",
        "url": "https://ohyourear.com/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "inLanguage": ["zh-CN", "en"],
        "description": "浏览器里的练耳应用：单音、音程、和弦、旋律、节奏五组练习。游客可直接开始，登录后可保存进度、错题本与连续打卡。",
        "featureList": [
          "单音练习",
          "音程练习",
          "和弦练习",
          "旋律练习",
          "节奏练习",
          "错题本",
          "每日练习",
          "题单闯关"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
      }
    </script>

    <script>
      // Apply the stored theme before first paint, otherwise dark-mode readers get a
      // white flash while the React tree mounts. The cookie first: on this site it is
      // the preference written by the app, and it is the copy both sites share. Keep in
      // step with packages/shared/src/prefs.ts.
      try {
        const cookie = document.cookie.match(/(?:^|; )oye_prefs=([^;]*)/)
        const fromCookie = cookie ? cookie[1].split('|')[0] : null
        const stored = JSON.parse(localStorage.getItem('oye-app-storage') || '{}')
        const theme = fromCookie || (stored.state && stored.state.theme) || 'system'
        const dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch {
        // Unreadable storage: fall through to the light default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
