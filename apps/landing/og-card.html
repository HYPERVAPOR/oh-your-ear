<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card — the source for public/og.png</title>
    <!--
      Render with the dev server running:

        chrome --headless=new --window-size=1200,630 --hide-scrollbars \
          --force-device-scale-factor=1 --virtual-time-budget=6000 \
          --screenshot=apps/landing/public/og.png \
          http://localhost:5174/og-card.html

      Three things and nothing else: the mark, the name, the call to action. A share card
      is shown small, so anything else turns into grey mush in a feed.

      English on purpose: it rides with the title, the description and llms.txt, all of
      which a crawler or a link preview reads. Keep the palette in step with
      packages/shared/src/tokens.css.
    -->
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #12100f;
        color: #fafaf9;
        font-family: 'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace;
        font-feature-settings: 'zero' 1;
        -webkit-font-smoothing: antialiased;
        display: flex;
      }
      /* Framed like everything else in the product: one hairline, inset. */
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid #3b332e;
      }
      .stack {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 44px;
      }
      .mark {
        width: 96px;
        height: 96px;
        padding: 18px;
        border: 1px solid #3b332e;
        color: #fafaf9;
      }
      .name {
        font-size: 76px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .cta {
        display: flex;
        align-items: center;
        height: 64px;
        gap: 14px;
        padding: 0 32px;
        background: #fafaf9;
        color: #0c0a09;
        font-size: 26px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>

    <div class="stack">
      <!-- lucide's ear, cropped to its own bounding box so the glyph fills the plate
           instead of floating small in the middle of a 32-unit frame. -->
      <svg
        class="mark"
        viewBox="5 1 16 25"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="square"
        stroke-linejoin="round"
      >
        <path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0" />
        <path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4" />
      </svg>

      <div class="name">OH YOUR EAR</div>

      <div class="cta">
        Practice
        <!-- Lucide's play, filled: the same glyph the site's button uses. -->
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
          <path
            d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
          />
        </svg>
      </div>
    </div>
  </body>
</html>
