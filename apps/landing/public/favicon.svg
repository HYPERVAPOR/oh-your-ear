<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The brand ear on a backing plate, in the product's own two palettes. The media
       query is inside the file, so one favicon covers both colour schemes and follows a
       reader who switches: black glyph on paper in light, white on near-black in dark.
       Colours are the tokens from packages/shared/src/tokens.css; the stroke is lucide's
       ear at the same weight the interface draws it, with square caps to match. -->
  <style>
    :root { --plate: #ffffff; --mark: #0c0a09; }
    @media (prefers-color-scheme: dark) { :root { --plate: #12100f; --mark: #fafaf9; } }
  </style>
  <rect width="32" height="32" fill="var(--plate)"/>
  <g transform="translate(5.5 5.5) scale(0.875)" fill="none" stroke="var(--mark)"
     stroke-width="2" stroke-linecap="square" stroke-linejoin="round">
    <path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"/>
    <path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"/>
  </g>
</svg>
